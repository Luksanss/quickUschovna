<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex;align-items:center;justify-content:center;line-height:0;color:inherit;flex:none">
<sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 18 18" width="{{ px }}" height="{{ px }}" style="display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><rect x="2" y="3" width="14" height="3.75" rx="1"></rect><path d="M3.25 6.75V13.5a1.75 1.75 0 0 0 1.75 1.75h8a1.75 1.75 0 0 0 1.75-1.75V6.75"></path><path d="M9 13V9.4M7.2 11.1L9 9.3l1.8 1.8"></path></svg>
</sc-if>
<sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 18 18" width="{{ px }}" height="{{ px }}" style="display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M2.5 7.5V13.5a1.75 1.75 0 0 0 1.75 1.75h9.5a1.75 1.75 0 0 0 1.75-1.75V7.5"></path><path d="M9 2.6V11.2M6.6 8.8L9 11.2l2.4-2.4"></path></svg>
</sc-if>
<sc-if value="{{ isTarget }}" hint-placeholder-val="{{ false }}">
<span style="display:inline-flex;background:var(--acc, #007AFF);color:#fff;border-radius:5px;padding:2px 5px;margin:-2px -5px">
<svg viewBox="0 0 18 18" width="{{ px }}" height="{{ px }}" style="display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M2.5 7.5V13.5a1.75 1.75 0 0 0 1.75 1.75h9.5a1.75 1.75 0 0 0 1.75-1.75V7.5"></path><path d="M9 2.6V11.2M6.6 8.8L9 11.2l2.4-2.4"></path></svg>
</span>
</sc-if>
<sc-if value="{{ isProgress }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 18 18" width="{{ px }}" height="{{ px }}" style="display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><circle cx="9" cy="9" r="7" style="opacity:.3"></circle><circle cx="9" cy="9" r="7" transform="rotate(-90 9 9)" style="stroke-linecap:butt;stroke-dasharray:{{ dash }}"></circle><path d="M9 12.1V6.3M6.8 8.5L9 6.2l2.2 2.3" style="stroke-width:1.5"></path></svg>
</sc-if>
<sc-if value="{{ isZipping }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 18 18" width="{{ px }}" height="{{ px }}" style="display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><circle cx="9" cy="9" r="7" style="opacity:.55;stroke-linecap:butt;stroke-dasharray:2.2 2.2"></circle><path d="M9 12.1V6.3M6.8 8.5L9 6.2l2.2 2.3" style="stroke-width:1.5"></path></svg>
</sc-if>
<sc-if value="{{ isPaused }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 18 18" width="{{ px }}" height="{{ px }}" style="display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round"><circle cx="9" cy="9" r="7" style="opacity:.25"></circle><circle cx="9" cy="9" r="7" transform="rotate(-90 9 9)" style="opacity:.5;stroke-linecap:butt;stroke-dasharray:{{ dash }}"></circle><path d="M7.3 6.6v4.8M10.7 6.6v4.8" style="stroke-width:1.7"></path></svg>
</sc-if>
<sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 18 18" width="{{ px }}" height="{{ px }}" style="display:block"><defs><mask id="{{ mDone }}"><rect width="18" height="18" fill="#fff"></rect><path d="M5.6 9.3l2.3 2.3 4.5-4.7" style="fill:none;stroke:#000;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"></path></mask></defs><circle cx="9" cy="9" r="7.75" mask="{{ mDoneUrl }}" style="fill:currentColor"></circle></svg>
</sc-if>
<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 18 18" width="{{ px }}" height="{{ px }}" style="display:block"><defs><mask id="{{ mCut }}"><rect width="18" height="18" fill="#fff"></rect><circle cx="14" cy="14" r="5.3" fill="#000"></circle></mask><mask id="{{ mBang }}"><rect width="18" height="18" fill="#fff"></rect><path d="M14 11.7v2.4" style="stroke:#000;stroke-width:1.5;stroke-linecap:round"></path><circle cx="14" cy="16.2" r=".85" fill="#000"></circle></mask></defs><g mask="{{ mCutUrl }}" style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><rect x="2" y="3" width="14" height="3.75" rx="1"></rect><path d="M3.25 6.75V13.5a1.75 1.75 0 0 0 1.75 1.75h8a1.75 1.75 0 0 0 1.75-1.75V6.75"></path><path d="M9 13V9.4M7.2 11.1L9 9.3l1.8 1.8"></path></g><circle cx="14" cy="14" r="4" mask="{{ mBangUrl }}" style="fill:currentColor"></circle></svg>
</sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:60},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;open&quot;,&quot;target&quot;,&quot;zipping&quot;,&quot;progress&quot;,&quot;paused&quot;,&quot;done&quot;,&quot;error&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;default&quot;:0.35,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:18,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  uid = 'qi' + Math.random().toString(36).slice(2, 8);
  renderVals() {
    const st = this.props.state ?? 'idle';
    const p = Math.max(0, Math.min(1, Number(this.props.progress ?? 0)));
    const C = 2 * Math.PI * 7;
    const u = this.uid;
    return {
      px: this.props.size ?? 18,
      isIdle: st === 'idle', isOpen: st === 'open', isTarget: st === 'target', isProgress: st === 'progress',
      isZipping: st === 'zipping', isPaused: st === 'paused', isDone: st === 'done', isError: st === 'error',
      dash: `${(C * p).toFixed(2)} ${C.toFixed(2)}`,
      mDone: u + 'd', mCut: u + 'c', mBang: u + 'b',
      mDoneUrl: `url(#${u}d)`, mCutUrl: `url(#${u}c)`, mBangUrl: `url(#${u}b)`,
    };
  }
}
</script>
</body>
</html>
